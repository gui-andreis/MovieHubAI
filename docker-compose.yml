# Desenvolvimento local: sobe a IA + um Redis.
# A MovieHub API roda à parte (por padrão em http://localhost:5000 da sua máquina).
services:
  moviehub-ai:
    build: .
    container_name: moviehub-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MOVIEHUB_API_URL: ${MOVIEHUB_API_URL_DOCKER:-http://host.docker.internal:5000}
      REDIS_URL: redis://moviehub-ai-redis:6379
      PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      moviehub-ai-redis:
        condition: service_healthy

  moviehub-ai-redis:
    image: redis:7-alpine
    container_name: moviehub-ai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
